# go2rtc turns the raw H.264 that furbo_p2p.py emits into RTSP/WebRTC.
#
# The exec source runs on demand: go2rtc starts the stream only while a client
# is watching and stops it when idle, so the video P2P session is not held open
# continuously. /app/stream.sh reads the chosen quality and republishes to the
# {output} endpoint go2rtc provides.
streams:
  furbo:
    - "exec:/app/stream.sh {output}#killsignal=15#killtimeout=8"

api:
  listen: ":1984"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"

log:
  level: ${GO2RTC_LOG}
