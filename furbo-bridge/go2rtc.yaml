# go2rtc turns the raw H.264 that furbo_p2p.py emits into RTSP/WebRTC.
#
# The exec source runs on demand: go2rtc starts the stream only while a client
# is watching and stops it when idle, so the video P2P session is not held open
# continuously. /app/stream.sh reads the chosen quality and republishes to the
# {output} endpoint go2rtc provides.
streams:
  furbo:
    - "exec:/app/stream.sh {output}#killsignal=15#killtimeout=8"
    # Two-way audio: go2rtc pipes the client mic here (16-bit 16 kHz mono PCM)
    # and talk.sh forwards it to the camera speaker.
    - "exec:/app/talk.sh#backchannel=1#killsignal=15#killtimeout=5"

# The go2rtc API (config, stream list, snapshots) is for the bridge's own use;
# it needs no network exposure, so bind it to loopback. RTSP/WebRTC below stay
# reachable so Home Assistant can pull the stream.
api:
  listen: "127.0.0.1:1984"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"

log:
  level: ${GO2RTC_LOG}
