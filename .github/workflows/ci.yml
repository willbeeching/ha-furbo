name: CI

# Every action is pinned to a full commit SHA (the trailing comment records the
# tag it corresponds to). When bumping one, update both the SHA and the comment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.9.9"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv venv
      - run: uv pip install -r requirements-lint.txt
      - name: Ruff lint
        run: uv run ruff check custom_components/furbo tests scripts
      - name: Ruff format
        run: uv run ruff format --check custom_components/furbo tests scripts

  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup-python
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv venv --python "${{ steps.setup-python.outputs.python-path }}"
      - run: uv pip install -r requirements-lint.txt -r requirements-test-latest.txt
      - name: mypy (strict, against real Home Assistant)
        run: uv run mypy --strict custom_components/furbo

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: min
            python: "3.13"
            requirements: requirements-test-min.txt
          - name: latest
            python: "3.14"
            requirements: requirements-test-latest.txt
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup-python
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv venv --python "${{ steps.setup-python.outputs.python-path }}"
      - run: uv pip install --prerelease=allow -r ${{ matrix.requirements }}
      - name: Import smoke test (no network at import)
        run: uv run python -c "import custom_components.furbo, custom_components.furbo.api, custom_components.furbo.config_flow"
      - name: Run tests with coverage
        run: uv run pytest tests -p no:cacheprovider --cov=custom_components.furbo --cov-report=xml --cov-report=term
      - name: Enforce per-module coverage (>=95%, config flow 100%)
        run: uv run python scripts/check_coverage.py coverage.xml

  quality-scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv venv
      - run: uv pip install pyyaml
      - run: uv run python scripts/check_quality_scale.py

  bridge:
    # Lint and test the Furbo Bridge add-on's Python (its own ruff config and
    # test suite, separate from the integration's quality gates).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: furbo-bridge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup-python
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
      # Use an explicit venv and call its binaries directly. The add-on has no
      # pyproject.toml, so `uv run` would resolve the repository-root project
      # instead and miss these tools.
      - run: uv venv --python "${{ steps.setup-python.outputs.python-path }}" .venv
      - run: uv pip install --python .venv -r ../requirements-lint.txt -r requirements-test.txt
      - name: Ruff lint (add-on)
        run: .venv/bin/ruff check src tests
      - name: Ruff format (add-on)
        run: .venv/bin/ruff format --check src tests
      # Coverage spans all three production modules. furbo_p2p.py is largely
      # ctypes glue to the native TUTK SDK that only runs against real hardware
      # (see HARDWARE_VERIFICATION.md), so the overall floor is lower than the
      # integration's; its pure decode/lifecycle logic is covered by tests.
      - name: Tests with coverage (all bridge modules)
        run: >-
          .venv/bin/python -m pytest
          --cov=furbo_bridge --cov=furbo_cloud --cov=furbo_p2p
          --cov-report=term-missing --cov-fail-under=50

  release-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Build and verify the reproducible archive
        run: python scripts/build_release.py

  addon-image:
    # Build the add-on image for both architectures (so a break on either is
    # caught in CI) and scan the amd64 image for known vulnerabilities, emitting
    # an SBOM artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build both architectures
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: furbo-bridge
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: furbo-bridge
          load: true
          tags: furbo-bridge:ci
      - name: Vulnerability scan (fail on fixed HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: furbo-bridge:ci
          format: table
          severity: CRITICAL,HIGH
          # Only fail on vulnerabilities that have a fix available, so the build
          # breaks when we ship something patchable (as aiohttp did) but not on
          # unfixed upstream base-image advisories we cannot action.
          ignore-unfixed: "true"
          exit-code: "1"
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: furbo-bridge:ci
          format: cyclonedx
          output: furbo-bridge.sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: furbo-bridge-sbom
          path: furbo-bridge.sbom.json

  addon-version:
    # On pull requests, require a version bump when shipped add-on files change,
    # so Home Assistant actually offers the update to installed users.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Require add-on version bump on content change
        run: python scripts/check_addon_version.py "origin/${{ github.base_ref }}"

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          # 'brands' requires a separate submission to home-assistant/brands.
          ignore: brands

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
        with:
          args: -color
