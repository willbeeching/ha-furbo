name: CI

# NOTE: third-party actions below are pinned to tags. Convert every third-party
# action to a full commit SHA before enabling branch protection. SHAs could not
# be resolved in the authoring environment (no GitHub API access to those repos).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.9.9"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv venv
      - run: uv pip install -r requirements-lint.txt
      - name: Ruff lint
        run: uv run ruff check custom_components/furbo tests scripts
      - name: Ruff format
        run: uv run ruff format --check custom_components/furbo tests scripts

  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv venv --python "${{ steps.setup-python.outputs.python-path }}"
      - run: uv pip install -r requirements-lint.txt -r requirements-test-latest.txt
      - name: mypy (strict, against real Home Assistant)
        run: uv run mypy --strict custom_components/furbo

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: min
            python: "3.13"
            requirements: requirements-test-min.txt
          - name: latest
            python: "3.14"
            requirements: requirements-test-latest.txt
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv venv --python "${{ steps.setup-python.outputs.python-path }}"
      - run: uv pip install --prerelease=allow -r ${{ matrix.requirements }}
      - name: Import smoke test (no network at import)
        run: uv run python -c "import custom_components.furbo, custom_components.furbo.api, custom_components.furbo.config_flow"
      - name: Run tests with coverage
        run: uv run pytest tests -p no:cacheprovider --cov=custom_components.furbo --cov-report=xml --cov-report=term
      - name: Enforce per-module coverage (>=95%, config flow 100%)
        run: uv run python scripts/check_coverage.py coverage.xml

  quality-scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv venv
      - run: uv pip install pyyaml
      - run: uv run python scripts/check_quality_scale.py

  bridge:
    # Lint and test the Furbo Bridge add-on's Python (its own ruff config and
    # test suite, separate from the integration's quality gates).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: furbo-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv venv --python "${{ steps.setup-python.outputs.python-path }}"
      - run: uv pip install -r ../requirements-lint.txt -r requirements-test.txt
      - name: Ruff lint (add-on)
        run: uv run ruff check src tests
      - name: Ruff format (add-on)
        run: uv run ruff format --check src tests
      - name: Tests with coverage (auth boundary, worker dispatch, cloud client)
        run: >-
          uv run pytest
          --cov=furbo_bridge --cov=furbo_cloud
          --cov-report=term-missing --cov-fail-under=80

  release-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and verify the reproducible archive
        run: python scripts/build_release.py

  addon-version:
    # On pull requests, require a version bump when shipped add-on files change,
    # so Home Assistant actually offers the update to installed users.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require add-on version bump on content change
        run: python scripts/check_addon_version.py "origin/${{ github.base_ref }}"

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # 'brands' requires a separate submission to home-assistant/brands.
          ignore: brands

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
