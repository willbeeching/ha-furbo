name: CI

# Every action is pinned to a full commit SHA (the trailing comment records the
# tag it corresponds to). When bumping one, update both the SHA and the comment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.9.9"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv venv
      - run: uv pip install -r requirements-lint.txt
      - name: Ruff lint
        run: uv run ruff check custom_components/furbo tests scripts
      - name: Ruff format
        run: uv run ruff format --check custom_components/furbo tests scripts

  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup-python
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv venv --python "${{ steps.setup-python.outputs.python-path }}"
      - run: uv pip install -r requirements-lint.txt -r requirements-test-latest.txt
      - name: mypy (strict, against real Home Assistant)
        run: uv run mypy --strict custom_components/furbo

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: min
            python: "3.13"
            requirements: requirements-test-min.txt
          - name: latest
            python: "3.14"
            requirements: requirements-test-latest.txt
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup-python
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv venv --python "${{ steps.setup-python.outputs.python-path }}"
      - run: uv pip install --prerelease=allow -r ${{ matrix.requirements }}
      - name: Import smoke test (no network at import)
        run: uv run python -c "import custom_components.furbo, custom_components.furbo.api, custom_components.furbo.config_flow"
      - name: Run tests with coverage
        run: uv run pytest tests -p no:cacheprovider --cov=custom_components.furbo --cov-report=xml --cov-report=term
      - name: Enforce per-module coverage (>=95%, config flow 100%)
        run: uv run python scripts/check_coverage.py coverage.xml

  quality-scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv venv
      - run: uv pip install pyyaml
      - run: uv run python scripts/check_quality_scale.py

  bridge:
    # Lint and test the Furbo Bridge add-on's Python (its own ruff config and
    # test suite, separate from the integration's quality gates).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: furbo-bridge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup-python
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
      # Use an explicit venv and call its binaries directly. The add-on has no
      # pyproject.toml, so `uv run` would resolve the repository-root project
      # instead and miss these tools.
      - run: uv venv --python "${{ steps.setup-python.outputs.python-path }}" .venv
      - run: uv pip install --python .venv -r ../requirements-lint.txt -r requirements-test.txt
      # The add-on image carries ffmpeg, and the audio format tests ask it
      # whether a packaging really decodes. Without it here those tests skip,
      # and the check that replaced the 1.3.3 guess would go unrun.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Ruff lint (add-on)
        run: .venv/bin/ruff check src tests
      - name: Ruff format (add-on)
        run: .venv/bin/ruff format --check src tests
      # Coverage spans all three production modules. furbo_p2p.py is largely
      # ctypes glue to the native TUTK SDK that only runs against real hardware
      # (see HARDWARE_VERIFICATION.md), so the overall floor is lower than the
      # integration's; its pure decode/lifecycle logic is covered by tests.
      - name: Tests with coverage (all bridge modules)
        run: >-
          .venv/bin/python -m pytest
          --cov=furbo_audio --cov=furbo_bridge --cov=furbo_cloud --cov=furbo_p2p
          --cov-report=term-missing --cov-fail-under=50

  release-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Build and verify the reproducible archive
        run: python scripts/build_release.py

  addon-image:
    # Build the add-on image for both architectures (so a break on either is
    # caught in CI) and scan the amd64 image for known vulnerabilities, emitting
    # an SBOM artifact.
    runs-on: ubuntu-latest
    env:
      # Pinned by digest, as every other artefact this build fetches is. Bump
      # the tag and the digest together; the digest is what is actually pulled.
      SCANNER: ghcr.io/aquasecurity/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build both architectures
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: furbo-bridge
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: furbo-bridge
          load: true
          tags: furbo-bridge:ci
      # Trivy runs from its own published image rather than through
      # aquasecurity/trivy-action. The action installs the Trivy binary from a
      # GitHub release asset, and on this runner that download fails with
      # curl's exit code 6, "could not resolve host", so the scan never starts:
      # every step after the install is skipped and the job reports red with no
      # findings in it. That happened at both v0.69.3 and v0.70.0, so it is the
      # download host rather than the version. The same job pulls its base
      # images over the container registry without trouble, so the scan goes
      # the way that demonstrably works here.
      #
      # Scanned from a saved tarball rather than over a mounted Docker socket:
      # the socket would hand the scanner control of the runner's daemon, and
      # it buys nothing when the image is right here.
      #
      # --ignore-unfixed: only fail on vulnerabilities that have a fix
      # available, so the build breaks when we ship something patchable (as
      # aiohttp did) but not on unfixed upstream advisories we cannot action.
      - name: Export the built image for scanning
        run: docker save furbo-bridge:ci -o "$RUNNER_TEMP/furbo-bridge.tar"
      - name: Vulnerability scan (fail on fixed HIGH/CRITICAL)
        run: |
          docker run --rm -v "$RUNNER_TEMP:/scan" "$SCANNER" image \
            --input /scan/furbo-bridge.tar \
            --format table \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1
      - name: Generate SBOM (CycloneDX)
        run: |
          docker run --rm -v "$RUNNER_TEMP:/scan" "$SCANNER" image \
            --input /scan/furbo-bridge.tar \
            --format cyclonedx \
            --output /scan/furbo-bridge.sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: furbo-bridge-sbom
          path: ${{ runner.temp }}/furbo-bridge.sbom.json

  addon-version:
    # Require a version bump when shipped add-on files change, so Home
    # Assistant actually offers the update to installed users. This ran on
    # pull requests only, and a push to main walked straight past it: three
    # fixes shipped under a version number their reporter already had.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Require add-on version bump on content change
        env:
          # A pull request compares against its base; a push against what was
          # on the branch before it.
          BASE: >-
            ${{ github.event_name == 'pull_request'
                && format('origin/{0}', github.base_ref)
                || github.event.before }}
        # shellcheck sees no env block, so a local named "base" reads to it as
        # a misspelling of BASE (SC2153). Named apart to keep it quiet.
        run: |
          ref="$BASE"
          # A first push, a force-push or a manual run leaves no usable before
          # commit. The previous commit is the honest comparison there.
          if ! git rev-parse --verify --quiet "${ref}^{commit}" >/dev/null; then
            ref="HEAD^"
          fi
          python scripts/check_addon_version.py "$ref"

  changelog:
    # Runs on pushes too, not only pull requests: the add-on's version guard
    # is pull-request-only and a push to main walked straight past it, which
    # is how a fix once shipped under a version users already had.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Require release notes for the declared version
        run: python scripts/release_notes.py

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          # 'brands' requires a separate submission to home-assistant/brands.
          ignore: brands

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
        with:
          args: -color
