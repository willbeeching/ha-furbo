name: Release

# Publishes a release archive for a vX.Y.Z tag. The tag can be pushed, or
# named on a manual run, in which case the job creates it. The write-capable
# job uses only first-party actions plus the GitHub CLI (no third-party code).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.1.0-beta.1. Created if missing."
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Derive version from the tag
        id: version
        env:
          # On a tag push ref_name is the tag; on a manual run it is the branch
          # the run was started from, so the input names the tag instead.
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="${REF_NAME#v}"
          # Accept X.Y.Z or a prerelease like X.Y.Z-beta.1.
          if ! printf '%s' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Malformed version: $tag" >&2
            exit 1
          fi
          # The archive carries the manifest (base) version; the tag may add a
          # prerelease suffix.
          base="${tag%%-*}"
          prerelease=false
          [ "$base" != "$tag" ] && prerelease=true
          {
            echo "tag=v$tag"
            echo "base=$base"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"
      - name: Build, verify and checksum the archive
        env:
          VERSION: ${{ steps.version.outputs.base }}
        run: python scripts/build_release.py --expect-version "$VERSION" --output dist
      - name: Read the release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.base }}
        # Fails when the version has no entry. Generated notes would be a bare
        # compare link here (this repository is pushed to, not merged into),
        # and that is what a user sees in the HACS update prompt.
        run: python scripts/release_notes.py --version "$VERSION" --output notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          # --target is what lets a manual run create the tag; on a tag push the
          # tag already exists and this is the commit it points at either way.
          gh release create "$TAG" \
            dist/*.tar.gz dist/*.sha256 \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            "${flags[@]}"
