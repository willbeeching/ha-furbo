[project]
name = "ha-furbo"
version = "0.1.0"
description = "Home Assistant custom integration for Furbo dog cameras (cloud API)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "UP",          # pyupgrade
  "B",           # flake8-bugbear
  "C4",          # comprehensions
  "SIM",         # simplify
  "TID",         # tidy imports
  "RUF",         # ruff
  "ASYNC",       # async correctness
  "PL",          # pylint subset
  "D",           # pydocstyle
]
ignore = [
  "D203", "D213",  # conflicting docstring styles
  "PLR2004",       # magic values in tests are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "PLR0913", "SLF001"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components.furbo"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.coverage.run]
source = ["custom_components/furbo"]
branch = false

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
